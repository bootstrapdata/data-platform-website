<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060410" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfaff" media="(prefers-color-scheme: light)" />

    <!-- Theme + JS bootstrap (runs before paint to avoid flash) -->
    <script>
      (function () {
        try {
          document.documentElement.classList.add('js');
          var stored = localStorage.getItem('bd-theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {}
      })();
    </script>

    <title>Bootstrap Data — Governed customer data platform, in your cloud or ours</title>
    <meta
      name="description"
      content="Collect, govern, unify and activate first-party customer data with contracts, privacy rules and consent enforced on every event. Deploy in your own cloud (BYOC) or use Bootstrap Data Cloud."
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://bootstrapdata.in/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bootstrap Data" />
    <meta property="og:title" content="Bootstrap Data — Governed customer data platform, in your cloud or ours" />
    <meta
      property="og:description"
      content="Collect, govern, unify and activate first-party customer data with contracts, privacy rules and consent enforced on every event. Deploy in your own cloud (BYOC) or use Bootstrap Data Cloud."
    />
    <meta property="og:url" content="https://bootstrapdata.in/" />
    <meta property="og:image" content="https://bootstrapdata.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Bootstrap Data — Customer data you can trust, from the first event to every destination. BYOC and Cloud."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bootstrap Data — Governed customer data platform, in your cloud or ours" />
    <meta
      name="twitter:description"
      content="Customer data platform with contracts, privacy rules and consent enforced on every event. Run it in your own cloud (BYOC) or ours."
    />
    <meta name="twitter:image" content="https://bootstrapdata.in/og-image.png" />

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://bootstrapdata.in/#organization",
            "name": "Bootstrap Data",
            "url": "https://bootstrapdata.in/",
            "description": "Governed customer data platform, deployable in your own cloud (BYOC) or as a managed service.",
            "contactPoint": {
              "@type": "ContactPoint",
              "email": "contact@bootstrapdata.in",
              "contactType": "customer enquiries"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://bootstrapdata.in/#website",
            "url": "https://bootstrapdata.in/",
            "name": "Bootstrap Data",
            "publisher": { "@id": "https://bootstrapdata.in/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://bootstrapdata.in/#product",
            "name": "Bootstrap Data",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Customer data platform",
            "operatingSystem": "Kubernetes; managed cloud service",
            "description": "Collect, govern, unify and activate first-party customer data, with contracts, privacy rules and consent enforced on every event.",
            "url": "https://bootstrapdata.in/",
            "publisher": { "@id": "https://bootstrapdata.in/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
