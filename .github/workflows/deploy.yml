name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to read the private @bootstrapdata design-system package
# and publish the built site to GitHub Pages.
permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Route through the org-level Blacksmith runner variable, with a
    # GitHub-hosted arm64 fallback — matches data-platform-core.
    runs-on: ${{ vars.LIGHT_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # Authenticate npm to GitHub Packages for the @bootstrapdata scope.
          registry-url: https://npm.pkg.github.com
          scope: '@bootstrapdata'

      - name: Install dependencies
        run: npm ci
        env:
          # GITHUB_TOKEN has packages:read (granted above) — used by .npmrc.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ${{ vars.LIGHT_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
